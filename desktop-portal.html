<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面总览 (Win11)</title>
<style>
  /* ===========================================================
   * 全局重置 + 色彩变量
   * =========================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI",
                 "PingFang SC", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #1f2024;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
  }
  :root {
    --ink:        #1a1a1f;
    --ink-2:      #5a5a66;
    --ink-3:      #8a8a96;
    --accent:     #0078d4;
    --accent-hov: #106ebe;
    --bg-glass:   rgba(243, 243, 243, 0.72);
    --bg-window:  rgba(252, 252, 252, 0.94);
    --bg-taskbar: rgba(28, 28, 32, 0.62);
    --bg-start:   rgba(40, 40, 46, 0.80);
    --bg-dark:    rgba(20, 20, 24, 0.92);
    --border:     rgba(0, 0, 0, 0.08);
    --border-2:   rgba(255, 255, 255, 0.08);
    --shadow-sm:  0 2px 6px rgba(0, 0, 0, 0.10);
    --shadow-md:  0 8px 20px rgba(0, 0, 0, 0.18);
    --shadow-lg:  0 16px 40px rgba(0, 0, 0, 0.28),
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    --radius-sm:  6px;
    --radius-md:  10px;
    --radius-lg:  14px;
    --taskbar-h:  48px;
  }

  /* ===========================================================
   * 桌面 + 壁纸（经典 XP Bliss 风格：蓝天 / 白云 / 绿草地）
   * =========================================================== */
  .desktop {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #3a72c5;        /* 兜底蓝 */
  }
  .wallpaper {
    position: absolute;
    inset: 0;
    background: url('assets/desktop/wallpaper-bf.jpg') center/cover no-repeat;
    z-index: 0;
  }
  .wallpaper::after {
    /* 顶部柔光 + 底部暗角 ， 让前景元素更清楚 */
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.10) 0%, rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, 0) 75%, rgba(0, 0, 0, 0.20) 100%);
    pointer-events: none;
  }

  /* ===========================================================
   * 桌面图标（左列排列）
   * =========================================================== */
  .desktop-icons {
    position: absolute;
    left: 22px; top: 22px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .desktop-icon {
    width: 88px;
    padding: 6px 4px 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    transition: background .12s ease, transform .10s ease;
    border: 1px solid transparent;
  }
  .desktop-icon:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .desktop-icon.is-selected {
    background: rgba(0, 120, 212, 0.30);
    border-color: rgba(0, 120, 212, 0.55);
  }
  .desktop-icon:active { transform: scale(0.96); }
  .di-img {
    width: 48px; height: 48px;
    margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
  }
  .di-img img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .di-label {
    color: #fff;
    font-size: 12px;
    line-height: 1.3;
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.85),
      0 0 4px rgba(0, 0, 0, 0.4);
    word-break: break-all;
  }

  /* ===========================================================
   * 任务栏（Win11：开始 + 已开窗口 + 系统托盘）
   * 说明：搜索框不再常驻任务栏，默认隐藏，
   *       仅点击「开始」按钮或按下 Win 键时随开始菜单一起出现。
   * =========================================================== */
  .taskbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--taskbar-h);
    background: var(--bg-taskbar);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 8000;                 /* 始终高于窗口，保证任务栏不被遮挡 */
    display: flex; align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  .tb-start {
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    color: #fff;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s ease;
  }
  .tb-start:hover { background: rgba(255, 255, 255, 0.10); }
  .tb-start.is-active { background: rgba(255, 255, 255, 0.14); }
  .tb-start svg { width: 22px; height: 22px; }

  /* 已打开窗口图标（任务栏中部居中） */
  .tb-windows {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 4px;
    margin: 0 auto;
  }
  .tb-app {
    width: 40px; height: 40px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: background .12s ease;
  }
  .tb-app:hover { background: rgba(255, 255, 255, 0.14); }
  .tb-app.is-active {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .tb-app.is-active::after {
    content: '';
    position: absolute;
    bottom: -3px; left: 12px; right: 12px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  .tb-app.is-minimized::after {
    background: rgba(255, 255, 255, 0.45);
  }
  .tb-app img { width: 24px; height: 24px; }

  /* 系统托盘 + 时钟 */
  .tb-tray {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 4px;
    margin-left: auto;
    padding: 0 6px;
    height: 36px;
    color: #fff;
  }
  .tb-icon {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: background .12s ease;
  }
  .tb-icon:hover { background: rgba(255, 255, 255, 0.10); }
  .tb-clock {
    font-size: 12px;
    text-align: right;
    line-height: 1.2;
    margin-left: 8px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background .12s ease;
    white-space: pre-line;
  }
  .tb-clock:hover { background: rgba(255, 255, 255, 0.10); }

  /* ===========================================================
   * 开始菜单（居中弹出；搜索框内嵌于顶部，默认随菜单隐藏）
   * =========================================================== */
  .start-menu {
    position: fixed;
    bottom: calc(var(--taskbar-h) + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    height: 600px;
    background: var(--bg-start);
    backdrop-filter: blur(36px) saturate(150%);
    -webkit-backdrop-filter: blur(36px) saturate(150%);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    z-index: 9000;                 /* 高于一切窗口 */
    color: #fff;
    padding: 22px 26px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    animation: smIn .18s ease-out;
  }
  /* 关键：[hidden] 优先于 .start-menu { display:flex }，否则菜单默认会浮出来 */
  .start-menu[hidden] { display: none !important; }
  .ctx-menu[hidden]   { display: none !important; }
  @keyframes smIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .sm-search {
    height: 36px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 18px;
    display: flex; align-items: center;
    padding: 0 14px;
    color: rgba(255, 255, 255, 0.7);
  }
  .sm-search input {
    flex: 1;
    background: transparent; border: none; outline: none;
    color: #fff; font-size: 13px;
    margin-left: 8px;
  }
  .sm-search input::placeholder { color: rgba(255, 255, 255, 0.55); }

  .sm-section h3 {
    margin: 0 0 10px;
    font-size: 13px; font-weight: 500;
    color: rgba(255, 255, 255, 0.65);
  }
  .sm-section + .sm-section { margin-top: 4px; }
  .sm-apps {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .sm-app {
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.04);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    padding: 6px;
    gap: 4px;
    transition: background .12s ease, transform .10s ease;
  }
  .sm-app:hover { background: rgba(255, 255, 255, 0.14); }
  .sm-app:active { transform: scale(0.96); }
  .sm-app-icon { font-size: 26px; line-height: 1; }
  .sm-app-icon img { width: 30px; height: 30px; }
  .sm-app-name {
    font-size: 11px; color: rgba(255, 255, 255, 0.85);
    text-align: center;
    line-height: 1.2;
  }
  .sm-recommends {
    margin: 0; padding: 0; list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .sm-rec {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .sm-rec:hover { background: rgba(255, 255, 255, 0.08); }
  .sm-rec-icon {
    width: 28px; height: 28px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .sm-rec-name {
    font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sm-footer {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 4px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  .sm-user {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .sm-user:hover { background: rgba(255, 255, 255, 0.10); }
  .sm-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6ea8ff, #0078d4);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px;
    color: #fff;
  }
  .sm-power {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .sm-power:hover { background: rgba(255, 255, 255, 0.12); }

  /* ===========================================================
   * 窗口（可拖拽 / 多层级 / 最大化 / 最小化）
   * =========================================================== */
  .window {
    position: absolute;
    background: var(--bg-window);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    display: flex; flex-direction: column;
    border: 1px solid var(--border-2);
    min-width: 360px; min-height: 240px;
    transition: opacity .14s ease, transform .18s ease;
  }
  .window.is-minimized {
    opacity: 0;
    pointer-events: none;
    transform: translateY(40px) scale(0.85);
  }
  .window.is-maximized {
    border-radius: 0;
    border-left: none; border-right: none;
  }
  .win-titlebar {
    flex: 0 0 36px;
    background: transparent;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 0 0 12px;
    cursor: grab;
    user-select: none;
  }
  .win-titlebar:active { cursor: grabbing; }
  .win-icon {
    margin-right: 8px;
    font-size: 16px;
    display: flex; align-items: center;
  }
  .win-icon img { width: 18px; height: 18px; display: block; }
  .win-title {
    font-size: 13px; font-weight: 500;
    color: var(--ink);
    flex: 1;
    line-height: 36px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .win-controls {
    flex: 0 0 auto;
    display: flex; align-items: stretch;
    height: 36px;
  }
  .win-btn {
    width: 46px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font-size: 13px;
    transition: background .12s ease, color .12s ease;
  }
  .win-btn:hover { background: rgba(0, 0, 0, 0.05); }
  .win-btn.win-close:hover { background: #e81123; color: #fff; }
  .win-btn.win-close svg { width: 10px; height: 10px; }
  .win-body {
    flex: 1 1 auto;
    overflow: auto;
    color: var(--ink);
    background: transparent;
  }

  /* ===========================================================
   * 外链卡片（白底 + 毛玻璃 + hover 上浮）
   * 规则：只有点击卡片本身，才在新标签页打开对应链接。
   * =========================================================== */
  .link-card {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(12px) saturate(120%);
    -webkit-backdrop-filter: blur(12px) saturate(120%);
    border-radius: var(--radius-md);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(0, 0, 0, 0.04);
    cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease;
    text-decoration: none;
    color: inherit;
  }
  .link-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.14),
                0 0 0 1px rgba(0, 0, 0, 0.06);
  }
  .link-card:active { transform: translateY(-2px); }
  .link-card-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; line-height: 1;
    flex: 0 0 44px;
    color: #fff;
  }
  .link-card-icon.kind-bili { background: linear-gradient(135deg, #fb7299, #ff5b8d); }
  .link-card-icon.kind-xhs  { background: linear-gradient(135deg, #ff4458, #d72047); }
  .link-card-icon.kind-jd   { background: linear-gradient(135deg, #e1251b, #b51a12); }
  .link-card-icon.kind-doc  { background: linear-gradient(135deg, #1cb178, #0f8b5a); }
  .link-card-icon.kind-git  { background: linear-gradient(135deg, #4a4a4a, #1a1a1a); }
  .link-card-icon.kind-wiki { background: linear-gradient(135deg, #8b75c9, #5e4a9c); }
  .link-card-icon.kind-tao  { background: linear-gradient(135deg, #ff5000, #c43d00); }
  .link-card-body { flex: 1; min-width: 0; }
  .link-card-title {
    font-size: 14px; font-weight: 500;
    margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #1a1a1f;
  }
  .link-card-desc {
    font-size: 12px;
    color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link-card-arrow {
    flex: 0 0 auto;
    color: var(--ink-3);
    font-size: 18px;
    line-height: 1;
  }

  .links-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 14px;
  }
  .links-grid.cols-2 {
    grid-template-columns: 1fr 1fr;
  }

  /* ===========================================================
   * Edge 浏览器
   * =========================================================== */
  .edge-app {
    display: flex; flex-direction: column;
    height: 100%;
    background: #f6f7f9;
  }
  .edge-tabs {
    flex: 0 0 36px;
    display: flex; align-items: flex-end;
    background: #ececec;
    padding: 6px 8px 0;
    gap: 2px;
    border-bottom: 1px solid var(--border);
  }
  .edge-tab {
    padding: 6px 14px 8px;
    border-radius: 6px 6px 0 0;
    background: #ececec;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink-2);
    border: 1px solid var(--border);
    border-bottom: none;
    margin-bottom: -1px;
    transition: background .10s ease;
  }
  .edge-tab.is-active {
    background: #fff;
    color: var(--ink);
    font-weight: 500;
  }
  .edge-tab:hover:not(.is-active) { background: #e0e0e0; }
  .edge-urlbar {
    flex: 0 0 40px;
    background: #fff;
    display: flex; align-items: center;
    padding: 6px 12px;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .edge-nav {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    transition: background .10s ease;
  }
  .edge-nav:hover { background: rgba(0, 0, 0, 0.06); }
  .edge-url {
    flex: 1;
    background: #f3f3f3;
    border-radius: 14px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .edge-content {
    flex: 1; overflow: auto;
    background: #fafbfc;
  }
  .edge-hero {
    padding: 28px 24px 22px;
    background: linear-gradient(180deg, #e7f1fb, #fff);
    border-bottom: 1px solid var(--border);
  }
  .edge-hero h2 {
    margin: 0 0 6px;
    font-size: 20px;
    color: var(--ink);
  }
  .edge-hero p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-2);
  }
  .edge-section-title {
    padding: 16px 24px 8px;
    font-size: 14px; font-weight: 600;
    color: var(--ink);
  }

  /* ===========================================================
   * 回收站
   * =========================================================== */
  .recycle {
    background: #fff; height: 100%; overflow: auto;
  }
  .recycle-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: #f6f7f9;
    font-size: 12px; color: var(--ink-2);
  }
  .recycle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
    padding: 14px;
  }
  .recycle-item {
    padding: 12px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 10px;
    background: rgba(0, 0, 0, 0.025);
    transition: background .10s ease;
    cursor: pointer;
  }
  .recycle-item:hover { background: rgba(0, 120, 212, 0.10); }
  .recycle-item-icon {
    font-size: 22px;
    flex: 0 0 auto;
  }
  .recycle-item-name {
    font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
  }

  /* ===========================================================
   * 我的文件夹
   * =========================================================== */
  .folder {
    background: #fff; height: 100%;
    display: flex; flex-direction: column;
  }
  .folder-toolbar {
    flex: 0 0 36px;
    background: #f6f7f9;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 14px;
    gap: 12px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .folder-list {
    flex: 0 0 auto;
    max-height: 240px;
    overflow: auto;
  }
  .folder-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    transition: background .10s ease;
    cursor: default;
  }
  .folder-row:hover { background: rgba(0, 120, 212, 0.06); }
  .folder-row-icon { font-size: 18px; flex: 0 0 22px; text-align: center; }
  .folder-row-name { flex: 1; font-size: 13px; color: var(--ink); }
  .folder-row-size,
  .folder-row-time {
    flex: 0 0 110px;
    font-size: 12px; color: var(--ink-2);
    text-align: right;
  }

  /* ===========================================================
   * 微信
   * =========================================================== */
  .wechat {
    background: #ededed; height: 100%;
    display: flex; flex-direction: column;
  }
  .wc-header {
    flex: 0 0 44px;
    background: #ededed;
    border-bottom: 1px solid #d6d6d6;

  /* ===========================================================
   * 桌面右键菜单
   * =========================================================== */
  .ctx-menu {
    position: fixed;
    background: var(--bg-dark);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 8px;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 5px 0;
    min-width: 220px;
    z-index: 9500;                 /* 高于开始菜单，确保右键菜单在最上层 */
    color: #fff;
    font-size: 13px;
  }
  .ctx-item {
    padding: 8px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background .10s ease;
  }
  .ctx-item:hover { background: rgba(255, 255, 255, 0.10); }
  .ctx-item .key {
    margin-left: auto;
    color: rgba(255, 255, 255, 0.45);
    font-size: 11px;
  }
  .ctx-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.06);
    margin: 4px 0;
  }
  .ctx-item.has-sub::after {
    content: '›';
    margin-left: auto;
    color: rgba(255, 255, 255, 0.55);
  }

  /* ===========================================================
   * Toast 提示
   * =========================================================== */
  .toast {
    position: fixed;
    bottom: calc(var(--taskbar-h) + 16px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 28, 32, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    padding: 9px 18px;
    border-radius: 18px;
    font-size: 12px;
    z-index: 9800;                 /* 最高层提示 */
    box-shadow: var(--shadow-md);
    animation: toastIn .20s ease-out;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ===========================================================
   * 滚动条（Win11 风格）
   * =========================================================== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.20);
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.36);
    background-clip: content-box;
  }
  ::-webkit-scrollbar-track { background: transparent; }

/* =================================================================
 * 窗口状态：zCounter + winState(singletonIds)
 * 注意：窗口 z-index 从 100 起，远低于任务栏(8000)/开始菜单(9000)，
 *      保证弹层永远在最上方，不会出现错位 / 穿透。
 * ================================================================= */
let zCounter = 100;
const winState    = new Map();   // winId -> { app, el, minimized, maximized, prevRect, isActive }
let singletonIds  = {};          // appKey -> winId（单例 app 强制 reuse）

function nextId() {
  return 'win_' + Math.random().toString(36).slice(2, 9);
}

/* =================================================================
 * 核心：打开 / 关闭 / 最小化 / 最大化 / 聚焦
 * ================================================================= */
function openApp(appKey, payload) {
  const app = APPS[appKey];
  if (!app) return null;

  // 单例：已开就聚焦或恢复
  if (app.singleton && singletonIds[appKey]) {
    const id = singletonIds[appKey];
    const w = winState.get(id);
    if (w) {
      if (w.minimized) restoreWindow(id);
      focusWindow(id);
      return id;
    }
  }

  const id = nextId();
  const el = document.createElement('div');
  el.className = 'window';
  el.dataset.winId    = id;
  el.dataset.appKey   = appKey;

  const iconHTML = app.icon
    ? escapeHTML(app.icon)
    : (app.iconImg
        ? `<img src="${escapeHTML(app.iconImg)}" alt="">`
        : '▢');

  el.innerHTML = `
    <header class="win-titlebar">
      <span class="win-icon">${iconHTML}</span>
      <span class="win-title">${escapeHTML(app.title)}</span>
      <div class="win-controls">
        <button class="win-btn win-min"   title="最小化" aria-label="最小化">─</button>
        <button class="win-btn win-max"   title="最大化" aria-label="最大化">▢</button>
        <button class="win-btn win-close" title="关闭"   aria-label="关闭">✕</button>
      </div>
    </header>
    <div class="win-body" data-body></div>
  `;

  document.getElementById('windows-layer').appendChild(el);

  // 调用 app.build 把内容挂到 .win-body
  const body = el.querySelector('.win-body');
  app.build(body, { id, appKey, payload });

  // 初始位置 + 尺寸（屏幕中央，窗口间有微小错位避免完全重叠）
  const cw = app.size.w, ch = app.size.h;
  const cx = (window.innerWidth  - cw) / 2 + (Math.random() * 60 - 30);
  const cy = (window.innerHeight - ch - 80) / 2 + (Math.random() * 60 - 30);
  el.style.width  = cw + 'px';
  el.style.height = ch + 'px';
  el.style.left   = Math.max(20, cx) + 'px';
  el.style.top    = Math.max(20, cy) + 'px';

  const state = {
    app, el,
    minimized: false, maximized: false,
    prevRect: null, isActive: false
  };
  winState.set(id, state);
  if (app.singleton) singletonIds[appKey] = id;

  // 标题栏 + 三个按钮
  const titlebar = el.querySelector('.win-titlebar');
  const closeBtn = el.querySelector('.win-close');
  const minBtn   = el.querySelector('.win-min');
  const maxBtn   = el.querySelector('.win-max');

  closeBtn.addEventListener('click', e => { e.stopPropagation(); closeWindow(id); });
  minBtn  .addEventListener('click', e => { e.stopPropagation(); minimizeWindow(id); });
  maxBtn  .addEventListener('click', e => { e.stopPropagation(); toggleMaximize(id); });

  // 标题栏拖拽
  makeDraggable(el, titlebar);
  // 双击标题栏 = 最大化切换
  titlebar.addEventListener('dblclick', () => toggleMaximize(id));
  // 整窗点击 → 置顶
  el.addEventListener('mousedown', () => focusWindow(id), true);

  focusWindow(id);
  renderTaskbar();
  return id;
}

function closeWindow(id) {
  const w = winState.get(id);
  if (!w) return;
  // 清理 hook
  if (w.app && APPS[w.app.key] && singletonIds[w.app.key] === id) {
    delete singletonIds[w.app.key];
  }
  if (winState.get(id) && winState.get(id)._cleanup) {
    try { winState.get(id)._cleanup(); } catch (e) {}
  }
  w.el.remove();
  winState.delete(id);
  renderTaskbar();
}

function minimizeWindow(id) {
  const w = winState.get(id);
  if (!w) return;
  w.minimized = true;
  w.isActive  = false;
  w.el.classList.add('is-minimized');
  renderTaskbar();
}

function restoreWindow(id) {
  const w = winState.get(id);
  if (!w) return;
  w.minimized = false;
  w.el.classList.remove('is-minimized');
  focusWindow(id);
  renderTaskbar();
}

function toggleMaximize(id) {
  const w = winState.get(id);
  if (!w) return;
  if (w.maximized) {
    w.maximized = false;
    w.el.classList.remove('is-maximized');
    if (w.prevRect) {
      w.el.style.left   = w.prevRect.l + 'px';
      w.el.style.top    = w.prevRect.t + 'px';
      w.el.style.width  = w.prevRect.w + 'px';
      w.el.style.height = w.prevRect.h + 'px';
    }
  } else {
    w.prevRect = {
      l: parseFloat(w.el.style.left)   || 0,
      t: parseFloat(w.el.style.top)    || 0,
      w: parseFloat(w.el.style.width)  || 0,
      h: parseFloat(w.el.style.height) || 0
    };
    w.maximized = true;
    w.el.classList.add('is-maximized');
    w.el.style.left   = '0';
    w.el.style.top    = '0';
    w.el.style.width  = window.innerWidth + 'px';
    w.el.style.height = (window.innerHeight - 48) + 'px';   // 减任务栏
  }
  renderTaskbar();
}

function focusWindow(id) {
  zCounter++;
  winState.forEach(w => { w.isActive = false; });
  const w = winState.get(id);
  if (!w) return;
  w.isActive = true;
  w.el.style.zIndex = zCounter;
  renderTaskbar();
}

/* =================================================================
 * 拖拽：titlebar 为 handle，自动避开三个按钮
 * ================================================================= */
function makeDraggable(el, handle) {
  let ds = null;
  handle.addEventListener('mousedown', e => {
    if (e.target.closest('.win-btn')) return;     // 三个按钮不拖
    if (e.button !== 0) return;
    const w = winState.get(el.dataset.winId);
    if (!w || w.maximized) return;                // 最大化不拖
    ds = {
      startX: e.clientX,
      startY: e.clientY,
      startL: parseFloat(el.style.left) || 0,
      startT: parseFloat(el.style.top)  || 0
    };
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!ds) return;
    const dx = e.clientX - ds.startX;
    const dy = e.clientY - ds.startY;
    let nl = ds.startL + dx;
    let nt = ds.startT + dy;
    const maxL = window.innerWidth  - 60;
    const maxT = window.innerHeight - 60;
    if (nl < -el.offsetWidth + 100) nl = -el.offsetWidth + 100;   // 留半拉屏
    if (nl > maxL) nl = maxL;
    if (nt < 0)    nt = 0;
    if (nt > maxT) nt = maxT;
    el.style.left = nl + 'px';
    el.style.top  = nt + 'px';
  });
  document.addEventListener('mouseup', () => { ds = null; });
}

/* =================================================================
 * 任务栏同步：已开窗 / 最小化 / 当前聚焦
 * ================================================================= */
function renderTaskbar() {
  const list = document.getElementById('tb-windows');
  list.innerHTML = '';
  winState.forEach((w, id) => {
    const btn = document.createElement('button');
    btn.className = 'tb-app';
    if (w.isActive && !w.minimized) btn.classList.add('is-active');
    if (w.minimized) btn.classList.add('is-minimized');
    btn.title = w.app.title;
    const iconHTML = w.app.icon
      ? escapeHTML(w.app.icon)
      : (w.app.iconImg ? `<img src="${escapeHTML(w.app.iconImg)}" alt="">` : '▢');
    btn.innerHTML = iconHTML;
    btn.addEventListener('click', () => {
      if (w.minimized)          restoreWindow(id);
      else if (w.isActive)      minimizeWindow(id);
      else                      focusWindow(id);
    });
    list.appendChild(btn);
  });
}

/* =================================================================
 * 开始菜单
 * 说明：搜索框内嵌于开始菜单顶部，开始菜单默认隐藏 →
 *       搜索框随之隐藏；点击「开始」按钮或按下 Win 键才出现。
 * ================================================================= */
function renderStartMenu() {
  // 应用网格
  const grid = document.getElementById('sm-apps');
  grid.innerHTML = '';
  Object.values(APPS).forEach(app => {
    const div = document.createElement('div');
    div.className = 'sm-app';
    div.dataset.name = app.title;
    const iconHTML = app.icon
      ? escapeHTML(app.icon)
      : (app.iconImg ? `<img src="${escapeHTML(app.iconImg)}" alt="">` : '?');
    div.innerHTML = `
      <div class="sm-app-icon">${iconHTML}</div>
      <div class="sm-app-name">${escapeHTML(app.title)}</div>
    `;
    div.addEventListener('click', () => {
      openApp(app.key);
      toggleStartMenu(false);
    });
    grid.appendChild(div);
  });

  // 搜索框：输入时实时过滤应用网格（纯前端演示）
  const searchInput = document.querySelector('.start-menu .sm-search input');
  if (searchInput) {
    searchInput.oninput = () => {
      const q = (searchInput.value || '').trim().toLowerCase();
      grid.querySelectorAll('.sm-app').forEach(el => {
        const name = (el.dataset.name || '').toLowerCase();
        el.style.display = (!q || name.includes(q)) ? '' : 'none';
      });
    };
  }

  // 推荐列表（中性占位，不含任何个人化内容）
  const rec = document.getElementById('sm-recommends');
  const recommends = [
    { name: '项目文档.docx',   icon: '📄' },
    { name: '示例图片.png',    icon: '🖼️' },
    { name: '演示视频.mp4',    icon: '🎬' },
    { name: '工作表.xlsx',     icon: '📊' }
  ];
  rec.innerHTML = '';
  recommends.forEach(r => {
    const li = document.createElement('li');
    li.className = 'sm-rec';
    li.innerHTML = `
      <div class="sm-rec-icon">${escapeHTML(r.icon)}</div>
      <div class="sm-rec-name">${escapeHTML(r.name)}</div>
    `;
    li.addEventListener('click', () => {
      toggleStartMenu(false);
      showToast('已打开：' + r.name);
    });
    rec.appendChild(li);
  });
}

let startMenuOpen = false;
function toggleStartMenu(force) {
  const el = document.getElementById('start-menu');
  startMenuOpen = (force !== undefined) ? !!force : !startMenuOpen;
  if (startMenuOpen) {
    renderStartMenu();
    el.hidden = false;
    // 重置搜索框
    const si = el.querySelector('.sm-search input');
    if (si) { si.value = ''; }
  } else {
    el.hidden = true;
  }
  document.getElementById('tb-start').classList.toggle('is-active', startMenuOpen);

/* =================================================================
 * 桌面右键菜单
 * ================================================================= */
function showContextMenu(x, y) {
  const m = document.getElementById('ctx-menu');
  m.innerHTML = `
    <div class="ctx-item has-sub" data-act="view">查看 <span class="key">▶</span></div>
    <div class="ctx-item has-sub" data-act="sort">排序方式 <span class="key">▶</span></div>
    <div class="ctx-item" data-act="refresh">刷新 <span class="key">F5</span></div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" data-act="new-folder">新建文件夹</div>
    <div class="ctx-item" data-act="new-txt">新建文本文档</div>
    <div class="ctx-divider"></div>
    <div class="ctx-item" data-act="open-edge">打开 Edge 浏览器</div>
    <div class="ctx-item" data-act="open-settings">显示设置</div>
  `;
  m.hidden = false;

  // 先放默认位置，再避越界
  m.style.left = x + 'px';
  m.style.top  = y + 'px';
  requestAnimationFrame(() => {
    const r = m.getBoundingClientRect();
    if (r.right  > window.innerWidth)  m.style.left = (window.innerWidth  - r.width  - 8) + 'px';
    if (r.bottom > window.innerHeight) m.style.top  = (window.innerHeight - r.height - 8) + 'px';
  });

  m.querySelectorAll('[data-act]').forEach(item => {
    item.addEventListener('click', () => {
      const act = item.dataset.act;
      m.hidden = true;
      switch (act) {
        case 'refresh':       showToast('已刷新桌面'); break;
        case 'new-folder':    showToast('（演示）已创建"新建文件夹"'); break;
        case 'new-txt':       showToast('（演示）已创建"新建文本文档.txt"'); break;
        case 'open-edge':     openApp('edge'); break;
        case 'open-settings': openApp('settings'); break;
        case 'view':          showToast('查看：已切换为大图标'); break;
        case 'sort':          showToast('排序：按名称升序'); break;
      }
    });
  });
}
function hideContextMenu() {
  document.getElementById('ctx-menu').hidden = true;
}

/* =================================================================
 * Toast
 * ================================================================= */
let toastTimer = null;
function showToast(text, ttl) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ttl || 1800);
}

/* =================================================================
 * 时钟
 * ================================================================= */
function updateClock() {
  const el = document.getElementById('tb-clock');
  if (!el) return;
  const now  = new Date();
  const hh   = String(now.getHours())  .padStart(2, '0');
  const mm   = String(now.getMinutes()).padStart(2, '0');
  const ss   = String(now.getSeconds()) .padStart(2, '0');
  const date = `${now.getMonth() + 1}月${now.getDate()}日`;
  el.textContent = `${hh}:${mm}:${ss}\n${date}`;
}

/* =================================================================
 * 外链卡片渲染
 * 规则：只有点击卡片本身，才在浏览器新标签页打开对应链接。
 * ================================================================= */
function renderLinkCard(parent, link) {
  const card = document.createElement('div');
  card.className = 'link-card';
  const iconMap = { bili: '📺', xhs: '📕', jd: '🛒', doc: '📄', git: '🐙', wiki: '📚', tao: '🛍️' };
  card.innerHTML = `
    <div class="link-card-icon kind-${link.kind}">${iconMap[link.kind] || '🔗'}</div>
    <div class="link-card-body">
      <div class="link-card-title">${escapeHTML(link.title)}</div>
      <div class="link-card-desc">${escapeHTML(link.desc)}</div>
    </div>
    <div class="link-card-arrow">›</div>
  `;
  card.addEventListener('click', () => {
    // 仅此处跳转外部：新标签页打开，不覆盖当前游戏页面
    window.open(link.url, '_blank', 'noopener,noreferrer');
  });
  parent.appendChild(card);
  return card;
}
function renderLinksGrid(parent, links, opts) {
  const grid = document.createElement('div');
  grid.className = 'links-grid' + (opts && opts.cols === 2 ? ' cols-2' : '');
  links.forEach(l => renderLinkCard(grid, l));
  parent.appendChild(grid);
}

/* 通用：渲染一组链接卡片（外链窗口 / 小红书 / B站 复用） */
function buildLinksWindow(root, links) {
  root.innerHTML = `<div class="links-grid" data-grid></div>`;
  const grid = root.querySelector('[data-grid]');
  links.forEach(l => renderLinkCard(grid, l));
}

        <span class="back-link" data-back>返回首页</span>
      </div>` }
  };

  /* ====================== 路由 / 历史栈 / 外壳交互 ====================== */
  const HOME = 'huichuan://home';
  const hist = [HOME];
  let histIdx = 0;

  const NAV_ITEMS = [
    { key: 'home',     label: '首页' },
    { key: 'zhengwu',  label: '政务公开' },
    { key: 'minsheng', label: '民生资讯' },
    { key: 'fuwu',     label: '政务服务' },
    { key: 'hudong',   label: '互动交流' },
    { key: 'shuju',    label: '数据开放' },
    { key: 'ditu',     label: '网站地图' },
    { key: 'zoujin',   label: '走进回川' }
  ];

  function syncNav() {
    const cur = hist[histIdx];
    urlbar.value = (cur === HOME || cur === 'huichuan://' || cur === '') ? 'www.huichuan.gov.cn' : cur;
    root.querySelector('[data-act="back"]').disabled   = histIdx <= 0;
    root.querySelector('[data-act="fwd"]').disabled    = histIdx >= hist.length - 1;
  }
  function navigate(path) {
    if (histIdx < hist.length - 1) hist.length = histIdx + 1;   // 截断前进历史
    hist.push(path);
    histIdx = hist.length - 1;
    render(path);
    syncNav();
  }
  function back()   { if (histIdx > 0) { histIdx--; render(hist[histIdx]); syncNav(); } }
  function fwd()    { if (histIdx < hist.length - 1) { histIdx++; render(hist[histIdx]); syncNav(); } }
  function reload() { render(hist[histIdx]); }

  root.querySelector('[data-act="back"]').addEventListener('click', back);
  root.querySelector('[data-act="fwd"]').addEventListener('click', fwd);
  root.querySelector('[data-act="reload"]').addEventListener('click', reload);

  // 地址栏回车
  urlbar.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    let v = urlbar.value.trim();
    if (!v) return;
    if (/huichuan\.gov\.cn/i.test(v)) { navigate(HOME); return; }
    if (!/^huichuan:\/\//.test(v)) v = 'huichuan://' + v.replace(/^\/+/, '');
    navigate(v);
  });
  // 搜索框回车：先查 secretPages，否则进入搜索结果页
  searchbox.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = searchbox.value.trim();
    if (!q) return;
    if (secretPages[q]) navigate('huichuan://secret/' + q);
    else                 navigate('huichuan://search?q=' + encodeURIComponent(q));
  });

  /* ====================== 渲染分发 ====================== */
  function render(path) {
    if (path === HOME || path === 'huichuan://' || path === '') return renderHome();
    if (path === 'huichuan://zhengwu')            return renderZhengwuList();
    if (path === 'huichuan://minsheng' ||
        path === 'huichuan://fuwu'    ||
        path === 'huichuan://hudong'  ||
        path === 'huichuan://shuju')                 return renderPlaceholder(path);
    if (path === 'huichuan://zoujin' ||
        path === 'huichuan://ditu')                  return renderGeoMap(path.replace('huichuan://', ''));
    if (path.startsWith('huichuan://news/'))       return renderNews(parseInt(path.replace('huichuan://news/', ''), 10));
    if (path.startsWith('huichuan://notice/'))     return renderNotice(path.replace('huichuan://notice/', ''));
    if (path.startsWith('huichuan://message/'))   return renderMessage(path.replace('huichuan://message/', ''));
    if (path.startsWith('huichuan://zhengwu/'))   return renderZhengwu(path.replace('huichuan://zhengwu/', ''));
    if (path.startsWith('huichuan://secret/')) {
      const key = path.replace('huichuan://secret/', '');
      return secretPages[key] ? renderSecret(key) : render404();
    }
    if (path.startsWith('huichuan://search'))      return renderSearch();
    return render404();

  /* ====================== 通用框架 ====================== */
  function govNav(active) {

    ec.querySelectorAll('[data-back]').forEach(el    => el.addEventListener('click', () => navigate(HOME)));
    // 网站头部"站内搜索"框：与浏览器搜索框同源（先查 secretPages，否则进搜索结果页）
    const ts = ec.querySelector('.gov-top-search');

function wxLS(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function wxLSJ(k, d){ try{ const v = wxLS(k,''); return v? JSON.parse(v) : d; }catch(e){ return d; } }
function wxFmt(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* 微信剧情状态：与 gov-portal 共用 localStorage */
function wxReadState(){
  return {
    seen: wxLSJ('hc_wx_seen', {}),              // {1:ts,2:ts,3:ts,4:ts}
    npcTimes: wxLSJ('hc_npc_times', {}),        // {zhoubinkun:ts,...}
    linSeen: wxLS('hc_lin_seen','')==='1',
    ritualSeen: wxLS('hc_ritual_seen','')==='1',
    unlockTime: parseInt(wxLS('hc_unlockTime','0'),10) || Date.now()
  };
}
function wxUnlocked(st, n){
  if(n===1) return true;
  if(n===2) return !!(st.seen[1] || st.npcTimes.zhoubinkun || st.npcTimes.linmaocai || st.npcTimes.shenqingchuan || st.npcTimes.xuqing);
  if(n===3) return !!(st.seen[2] || st.linSeen);
  if(n===4) return !!(st.seen[3] || st.ritualSeen);
  return false;
}

    }
    refreshLocks();
  }

  function renderTab(n){
    const st = wxReadState();
    root.querySelectorAll('.wc-tab').forEach(t=>t.classList.toggle('active', +t.dataset.tab===n));
    if(!wxUnlocked(st, n)){

      return;
    }
    if(n!==1 && !st.seen[n]){ st.seen[n]=Date.now(); try{ localStorage.setItem('hc_wx_seen', JSON.stringify(st.seen)); }catch(e){} }
    stage.innerHTML = TABS[n].html;
    // 会话点击
    stage.querySelectorAll('[data-convo]').forEach(el=>{
      el.addEventListener('click', ()=>{ renderConvo(el.dataset.convo); });
    });
  }

  function renderConvo(k){
    const c = CONVOS[k];
    if(!c) return;
    markConvoRead(k);
    stage.innerHTML = c.html;
    const back = stage.querySelector('[data-back]');
    if(back) back.addEventListener('click', ()=>{ renderTab(1); });
  }

  root.querySelectorAll('.wc-tab').forEach(t=>{
    t.addEventListener('click', ()=>renderTab(+t.dataset.tab));
  });

  refreshLocks();
  renderTab(1);
}

  root.querySelectorAll('.desktop-icon').forEach(icon => {
    const appKey = icon.dataset.app;
    if (appKey === 'recycle') {
      icon.addEventListener('mouseenter', () => { if (trashImg) trashImg.src = 'assets/desktop/trash-hover.png'; });
      icon.addEventListener('mouseleave', () => { if (trashImg) trashImg.src = 'assets/desktop/trash-idle.png';  });
    }
    // 单击图标 → 弹出对应窗口（外链图标同样先弹窗口，不直接跳外站）
    icon.addEventListener('click', e => {
      e.stopPropagation();
      openApp(appKey);
    });
  });
  // 桌面空白处单击：取消选中 + 收起开始菜单 / 右键菜单
  document.getElementById('desktop').addEventListener('click', e => {
    if (!e.target.closest('.desktop-icon')) {
      root.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('is-selected'));
    }
  });
}

/* =================================================================
 * 全局右键菜单 + 点击空白关菜单 / 收起开始菜单
 * ================================================================= */
function initContextMenu() {
  const desktop = document.getElementById('desktop');
  desktop.addEventListener('contextmenu', e => {
    if (e.target.closest('.window'))         return;
    if (e.target.closest('.desktop-icon'))   return;
    if (e.target.closest('.taskbar'))        return;
    if (e.target.closest('.start-menu'))     return;
    e.preventDefault();
    showContextMenu(e.clientX, e.clientY);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.ctx-menu'))   hideContextMenu();
    // 点击桌面空白处 / 窗口外部 → 收起开始菜单（搜索框随之收回）
    if (!e.target.closest('.start-menu') && !e.target.closest('#tb-start')) {
      toggleStartMenu(false);
    }
  });
  // 键盘：ESC 关菜单；Win 键（Meta / OS）唤出 / 收起开始菜单（含搜索框）
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      hideContextMenu();
      toggleStartMenu(false);
    }
    if (e.key === 'Meta' || e.key === 'OS' || e.code === 'MetaLeft' || e.code === 'MetaRight') {
      e.preventDefault();
      toggleStartMenu();
    }
  });
}

/* =================================================================
 * 任务栏开始按钮
 * ================================================================= */
function initTaskbarStart() {
  document.getElementById('tb-start').addEventListener('click', e => {
    e.stopPropagation();
    toggleStartMenu();
  });
}

/* =================================================================
 * 启动
 * 默认桌面保持干净：不自动弹出任何窗口 / 搜索框。
 * ================================================================= */
window.addEventListener('DOMContentLoaded', () => {
  initDesktopIcons();
  initTaskbarStart();
  initContextMenu();
  updateClock();
  setInterval(updateClock, 1000);

  /* 兜底：初始化结束强制确保开始菜单 / 右键菜单都是隐藏状态。
     即便将来误调用 toggleStartMenu(true)，下一次页面启动默认仍是干净桌面。 */
  const _sm = document.getElementById('start-menu');
  if (_sm) _sm.hidden = true;
  const _cm = document.getElementById('ctx-menu');
  if (_cm) _cm.hidden = true;
  startMenuOpen = false;
  const _tb = document.getElementById('tb-start');
  if (_tb) _tb.classList.remove('is-active');

  // 浏览器尺寸变化 → 同步最大化窗口
  window.addEventListener('resize', () => {
    winState.forEach(w => {
      if (w.maximized) {
        w.el.style.width  = window.innerWidth + 'px';
        w.el.style.height = (window.innerHeight - 48) + 'px';
      }
    });
  });

  // 供 iframe 内 gov-portal 触发：打开微信窗口（页内，不新开标签页）
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'hc-open-wechat') {
      openApp('wechat');
    }
  });

  // 注意：默认不再自动打开 Edge，保持桌面纯净。
});
</script>
