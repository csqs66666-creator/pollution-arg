<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回川市公众信息网</title>
<style>
/* ==== 设计令牌 ==== */
:root{
  --ink:#222; --ink2:#555; --line:#e5e5e5; --line2:#eee;
  --blue:#00479D; --blue2:#0a5bb5; --red:#d63031;
  --paper:#f6f1e3; --paper2:#efe6cf;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);
  font-family:"SimSun","宋体",serif;font-size:13px;line-height:1.7}
a{color:var(--ink);text-decoration:none;cursor:pointer}
a:hover{color:var(--blue);text-decoration:underline}
img{max-width:100%;display:block}

/* ==== 顶栏 ==== */
.gov-top{display:flex;justify-content:space-between;align-items:center;
  padding:8px 22px;background:var(--blue);color:#fff}
.gov-top .site{font-size:20px;font-weight:700;letter-spacing:6px}
.gov-top .right{display:flex;align-items:center;gap:10px;font-size:12px}
.gov-top .right a{color:#fff;cursor:pointer}
.gov-top .right a:hover{text-decoration:underline}
.gov-top .right .sep{color:rgba(255,255,255,.6);margin:0 4px}
.gov-top .right input{height:24px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:0 12px;
  font-size:12px;outline:none;font-family:inherit;width:150px}
.gov-top .right input::placeholder{color:rgba(255,255,255,.7)}

/* ==== 主导航 ==== */
.gov-nav{display:flex;background:linear-gradient(180deg,#0052ad,#00479d);border-bottom:3px solid #003570}
.gov-nav a{flex:1;text-align:center;padding:12px 0;color:#fff;font-size:14px;
  letter-spacing:2px;border-right:1px solid rgba(255,255,255,.15);cursor:pointer;transition:background .12s}
.gov-nav a:last-child{border-right:none}
.gov-nav a:hover{background:rgba(255,255,255,.12);text-decoration:none}
.gov-nav a.active{background:#003570;font-weight:600;position:relative}
.gov-nav a.active::after{content:"";position:absolute;left:50%;bottom:-3px;
  transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;
  border-right:6px solid transparent;border-bottom:6px solid #fff}

/* ==== 内容容器 ==== */
.gov-wrap{padding:0;background:#fff}

/* ==== 首页 Banner ==== */
.gb{display:flex;height:320px;overflow:hidden;background:var(--paper);
  border-bottom:3px solid var(--blue);position:relative}
.gb .img{flex:0 0 60%;height:100%;
  background:url('assets/desktop/gov-banner.jpg') center/cover no-repeat}
.gb .paper{flex:1;padding:30px 36px;display:flex;flex-direction:column;justify-content:center;position:relative;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.4), transparent 60%),
    repeating-linear-gradient(45deg, rgba(120,90,40,.04) 0 2px, transparent 2px 6px),
    var(--paper)}
.gb .paper::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,transparent,rgba(120,80,30,.15),transparent)}
.gb .title{font-family:"SimHei","黑体",sans-serif;font-size:34px;font-weight:700;
  color:#1f5c3a;letter-spacing:6px;line-height:1.3}
.gb .sub{margin-top:16px;font-size:15px;color:#4a6b55;letter-spacing:3px}
.gb .badge{position:absolute;left:36px;bottom:18px;font-size:11px;color:#8a7a55;
  border:1px solid #c9b98a;padding:3px 10px;letter-spacing:1px;background:rgba(255,255,255,.4)}

/* ==== 三栏布局 ==== */
.g3{display:grid;grid-template-columns:60% 20% 20%;gap:18px;padding:18px 22px;background:#fff}
.g3 .col-l,.g3 .col-m,.g3 .col-r{min-width:0}

/* 区块标题 */
.bt{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
  padding-bottom:6px;margin-bottom:10px}
.bt .t{font-family:"SimHei","黑体",sans-serif;font-size:15px;font-weight:700;color:var(--ink)}
.bt.red .t{color:var(--red);border-left:3px solid var(--red);padding-left:8px}
.bt .more{font-size:12px;color:var(--ink2)}
.bt .more:hover{color:var(--blue)}

/* 新闻列表 */
.news-list{list-style:none;margin:0;padding:0}
.news-list li{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;
  border-bottom:1px dashed var(--line2);cursor:pointer;font-size:13px}
.news-list li:hover .ttl{color:var(--blue)}
.news-list .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.news-list .dt{color:#999;font-size:12px;flex-shrink:0}

/* 文旅区块 */
.travel{margin-top:16px;border:1px solid var(--line);padding:12px;background:#fafbfc}
.travel .stage{position:relative;width:100%;aspect-ratio:16/7;
  background:url('assets/desktop/gov-travel.jpg') center/cover no-repeat;border:1px solid var(--line2)}
.travel svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.travel .pin{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--red);
  border:2px solid #fff;box-shadow:0 0 0 2px rgba(214,48,49,.25),0 2px 4px rgba(0,0,0,.3);
  cursor:pointer;transform:translate(-50%,-50%);transition:transform .15s,box-shadow .15s}
.travel .pin:hover{transform:translate(-50%,-50%) scale(1.2);
  box-shadow:0 0 0 4px rgba(214,48,49,.35),0 2px 6px rgba(0,0,0,.4)}
.travel .pin .tip{position:absolute;left:50%;top:130%;transform:translateX(-50%);
  background:#fff;color:var(--ink);font-size:12px;padding:3px 10px;border-radius:12px;
  white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .15s}
.travel .pin:hover .tip{opacity:1}
.travel .cap{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  font-size:13px;color:var(--ink2)}
.travel .cap .btn{background:var(--blue);color:#fff;border:none;padding:5px 14px;font-size:12px;
  cursor:pointer;letter-spacing:1px}
.travel .cap .btn:hover{background:var(--blue2)}

/* 便民服务 */
.svc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.svc .card{background:#f5f7fa;border:1px solid #e8ecf2;border-radius:6px;padding:12px 8px;
  text-align:center;cursor:pointer;transition:background .12s,border-color .12s}
.svc .card:hover{background:#fff;border-color:var(--blue)}
.svc .card .ic{font-size:22px;line-height:1}
.svc .card .nm{margin-top:6px;font-size:12px;color:var(--ink)}

/* 右栏子块 */
.sub{margin-bottom:14px}
.notice-list{list-style:none;margin:0;padding:0}
.notice-list li{padding:6px 4px;border-bottom:1px dashed var(--line2);font-size:12.5px;cursor:pointer;transition:background 0.2s}
.notice-list li:hover .nt{color:var(--blue)}
.notice-list .nt{font-weight:600;color:var(--ink);line-height:1.4}
.notice-list .nb{color:var(--ink2);margin-top:3px;line-height:1.65}
.notice-list .nb .mk{color:var(--red);font-weight:700;margin-left:1px}
.notice-list .nd{color:#999;font-size:11px;margin-top:3px}
.notice-list li.has-detail{position:relative;padding-right:18px}
.notice-list li.has-detail::after{content:"›";position:absolute;right:6px;top:6px;font-size:14px;color:var(--blue);opacity:0.55;transition:all 0.2s}
.notice-list li.has-detail:hover{background:rgba(0,71,157,0.04)}
.notice-list li.has-detail:hover::after{opacity:1;transform:translateX(2px)}
.notice-list li.no-detail{opacity:0.92}
.notice-list li.no-detail::after{content:"·";position:absolute;right:8px;top:6px;font-size:12px;color:#b5b5b5;opacity:0.6}

/* === 公告公文详情页 === */
.nd-wrap{max-width:860px;margin:0 auto;padding:8px 0 40px}
.nd-paper{
  background:#fefdf9;
  border:1px solid #d9d4c5;
  padding:40px 56px 36px;
  position:relative;
  box-shadow:0 4px 18px rgba(0,0,0,0.06);
  color:#222;
  line-height:1.95;
  font-size:14.5px;
}
.nd-paper::before{
  content:"";position:absolute;left:0;right:0;top:0;height:6px;
  background:linear-gradient(90deg,#b22222 0,#b22222 28%,#fff 28%,#fff 32%,#b22222 32%,#b22222 60%,#fff 60%,#fff 64%,#b22222 64%,#b22222 100%);
}
.nd-paper .doc-no{
  text-align:center;font-size:13px;color:#666;letter-spacing:0.2em;margin-bottom:14px;
  border-bottom:1px solid #e2dccb;padding-bottom:14px;
}
.nd-paper h1.nd-title{
  text-align:center;font-size:24px;color:#222;margin:6px 0 4px;letter-spacing:0.1em;font-weight:700;
}
.nd-paper .nd-sub{
  text-align:center;color:#666;font-size:13px;margin-bottom:24px;letter-spacing:0.05em;
}
.nd-paper .nd-meta{
  display:flex;justify-content:space-between;font-size:12.5px;color:#666;
  border-bottom:1px solid #e2dccb;padding-bottom:12px;margin-bottom:18px;
}
.nd-paper .nd-meta b{color:#333}
.nd-paper .nd-body p{margin:0 0 14px;text-indent:2em;text-align:justify;text-justify:inter-ideograph}
.nd-paper .nd-body h3{font-size:16px;margin:22px 0 10px;color:#111;border-left:3px solid #b22222;padding-left:10px}
.nd-paper .nd-body ul,.nd-paper .nd-body ol{padding-left:1.6em;margin:6px 0 14px}
.nd-paper .nd-body li{margin-bottom:6px}
.nd-paper .nd-body .stamp{
  display:inline-block;border:2px solid #b22222;color:#b22222;font-weight:700;
  padding:2px 10px;border-radius:2px;margin:18px 0 0;letter-spacing:0.2em;font-size:12px;
  transform:rotate(-3deg);opacity:0.85;
}
.nd-paper .nd-sig{margin-top:30px;font-size:13px;color:#444;line-height:1.85;border-top:1px dashed #d9d4c5;padding-top:14px}
.nd-paper .nd-sig div{margin-bottom:4px}
.nd-paper .nd-back{
  display:block;margin:24px auto 0;text-align:center;color:var(--blue);font-size:13px;cursor:pointer;
}
.nd-paper .nd-back:hover{text-decoration:underline}
.msg-list{list-style:none;margin:0;padding:0}
.msg-list li{padding:5px 4px;font-size:12.5px;border-bottom:1px dashed var(--line2);cursor:pointer}
.msg-list li:hover{color:var(--blue)}
.btn-ghost{display:inline-block;background:#fff;color:var(--blue);border:1px solid var(--blue);
  padding:4px 12px;font-size:12px;cursor:pointer;margin-top:8px;letter-spacing:1px}
.btn-ghost:hover{background:var(--blue);color:#fff}
.map-mini{position:relative;width:100%;aspect-ratio:4/3;
  background:url('assets/desktop/gov-map.jpg') center/cover no-repeat;border:1px solid var(--line2);margin-top:4px}
.map-mini .pin{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);
  border:1.5px solid #fff;box-shadow:0 0 0 2px rgba(214,48,49,.2);transform:translate(-50%,-50%);
  cursor:pointer;transition:transform .15s}
.map-mini .pin.hot:hover{transform:translate(-50%,-50%) scale(1.6)}
.map-mini .pin .tip{position:absolute;left:50%;top:140%;transform:translateX(-50%);
  background:#fff;font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.15);opacity:0;pointer-events:none}
.map-mini .pin:hover .tip{opacity:1}
.map-link{display:block;text-align:center;margin-top:6px;font-size:12px;color:var(--blue);text-decoration:underline}

/* ==== 全域地理信息图 ==== */
.gmap-title{text-align:center;font-family:"SimHei","黑体",sans-serif;font-size:20px;color:var(--ink);
  padding:22px 0 12px;letter-spacing:3px;border-bottom:1px solid var(--line);margin-bottom:18px}
.gmap-stage-wrap{display:flex;justify-content:center;padding:0 22px 14px}
.gmap-stage{position:relative;width:100%;max-width:820px;aspect-ratio:4/3;
  background:url('assets/desktop/gov-map.jpg') center/cover no-repeat;border:1px solid #ccc;
  box-shadow:0 2px 12px rgba(0,0,0,.08);transition:filter .4s}
.gmap-stage .pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--red);
  border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 0 3px rgba(214,48,49,.25);
  cursor:pointer;transform:translate(-50%,-50%);transition:transform .15s}
.gmap-stage .pin:hover{transform:translate(-50%,-50%) scale(1.3)}
.gmap-stage .pin .tip{position:absolute;left:50%;top:130%;transform:translateX(-50%);
  background:#fff;padding:6px 12px;border-radius:6px;white-space:nowrap;font-size:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s;
  min-width:190px;text-align:left;line-height:1.5}
.gmap-stage .pin:hover .tip{opacity:1}
/* 时间锁伪装工具 */
/* === 地图页 · 22:00 时间门（输入 HH:MM = 22:00 进入 chapter1 启程） === */
.time-gate{display:flex;align-items:center;gap:8px;max-width:680px;margin:8px auto 14px;padding:8px 14px;background:rgba(255,255,255,.92);border:1px solid #c8c0a8;border-radius:2px;font-size:12px;letter-spacing:.1em}
.time-gate .tg-label{color:var(--ink2);font-family:"Songti SC",serif}
.time-gate input{width:68px;border:1px solid #bbb;padding:3px 6px;font-size:13px;font-family:monospace;letter-spacing:.05em;background:#fff;color:#231f18}
.time-gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(31,79,140,.15)}
.time-gate button{background:var(--blue);color:#fff;border:none;padding:4px 14px;font-size:12px;letter-spacing:.2em;cursor:pointer;border-radius:1px}
.time-gate button:hover{background:#1a3f6e}
.time-gate .tg-hint{color:#a02020;font-size:11px;letter-spacing:.1em;min-width:160px}
.time-gate.ok .tg-hint{color:#2c5b2c}
.time-gate input.shake{animation:tgShake .35s linear 1}
@keyframes tgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.timelock{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.95);
  border:1px solid #aaa;border-radius:4px;padding:5px 8px;font-size:12px;display:flex;
  align-items:center;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:5}
.timelock label{color:var(--ink2);font-size:11px}
.timelock input{width:58px;border:1px solid #bbb;padding:2px 4px;font-size:12px;
  font-family:inherit;outline:none}
.timelock input:focus{border-color:var(--blue)}
.timelock button{background:var(--blue);color:#fff;border:none;padding:2px 8px;font-size:11px;cursor:pointer}
/* 夜间模式 */
.gmap-stage.night{filter:brightness(.42) saturate(.55)}
.gmap-stage.night .pin{opacity:.15}
.gmap-stage .secret-pin{position:absolute;width:14px;height:14px;border-radius:50%;
  background:#5a0a0a;border:2px solid rgba(120,20,30,.7);box-shadow:0 0 12px 4px rgba(120,0,0,.6);
  transform:translate(-50%,-50%);display:none;animation:blink 1.2s infinite}
.gmap-stage.night .secret-pin{display:block}
@keyframes blink{0%,100%{opacity:.5;box-shadow:0 0 8px 2px rgba(120,0,0,.5)}
  50%{opacity:1;box-shadow:0 0 16px 6px rgba(180,0,0,.8)}}
.gmap-stage .secret-pop{position:absolute;background:rgba(20,0,0,.82);color:#f0d0d0;
  padding:7px 11px;border:1px solid rgba(180,40,40,.5);font-size:12px;border-radius:4px;
  display:none;max-width:240px;line-height:1.6;z-index:6}
.gmap-stage.night .secret-pop{display:block}
/* 血色荷纹水印 */
.gmap-stage .wm{position:absolute;width:90px;height:90px;opacity:.08;pointer-events:none}
.gmap-stage .wm.tl{top:6px;left:6px}.gmap-stage .wm.tr{top:6px;right:6px}
.gmap-stage .wm.bl{bottom:6px;left:6px}.gmap-stage .wm.br{bottom:6px;right:6px}
.gmap-scale{position:absolute;left:14px;bottom:10px;background:rgba(255,255,255,.85);
  padding:2px 8px;font-size:11px;color:var(--ink);border:1px solid #aaa;z-index:4}
.gmap-stage.night .gmap-scale{background:rgba(0,0,0,.7);color:#ddd;border-color:#555}
.gmap-toolbar{display:flex;justify-content:center;gap:8px;padding:6px 22px 18px}
.gmap-toolbar button{background:#fff;border:1px solid #aaa;padding:4px 12px;font-size:12px;cursor:pointer}
.gmap-toolbar button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.gmap-toolbar .scale{margin-left:12px;line-height:24px;font-size:12px;color:var(--ink2)}

/* ==== 文旅攻略 ==== */
.lv{padding:22px 36px;max-width:1080px;margin:0 auto}
.lv h1{font-family:"SimHei","黑体",sans-serif;font-size:22px;text-align:center;color:var(--ink);
  letter-spacing:3px;margin:6px 0 14px}
.lv .sub-title{text-align:center;color:var(--ink2);font-size:13px;margin-bottom:18px}
.lv .pan{position:relative;width:100%;aspect-ratio:16/6;
  background:url('assets/desktop/gov-travel.jpg') center/cover no-repeat;border:1px solid var(--line);margin-bottom:18px}
.lv .pan .pin{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--red);
  border:2px solid #fff;box-shadow:0 0 0 2px rgba(214,48,49,.25);cursor:pointer;
  transform:translate(-50%,-50%);transition:transform .15s}
.lv .pan .pin:hover{transform:translate(-50%,-50%) scale(1.2)}
.lv .pan .pin .tip{position:absolute;left:50%;top:130%;transform:translateX(-50%);background:#fff;
  padding:3px 10px;border-radius:12px;font-size:12px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:0;pointer-events:none}
.lv .pan .pin:hover .tip{opacity:1}
.lv .points{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.lv .pt{border:1px solid var(--line);background:#fafbfc;padding:14px}
.lv .pt h3{font-family:"SimHei","黑体",sans-serif;color:var(--blue);margin:0 0 8px;font-size:15px;
  border-bottom:1px solid var(--line2);padding-bottom:6px}
.lv .pt .row{font-size:12.5px;margin:4px 0;color:var(--ink2)}
.lv .pt .row b{color:var(--ink)}
.lv .pt .anomaly{margin-top:8px;padding:6px 10px;background:#fdf5e6;border-left:2px solid #c79a3a;
  font-size:12px;color:#7a5a20}
.lv .routes{margin-bottom:18px}
.lv .routes h3{font-family:"SimHei","黑体",sans-serif;font-size:15px;color:var(--ink);
  border-bottom:1px solid var(--line);padding-bottom:6px}
.lv .route{margin-top:8px;font-size:13px;line-height:1.9}
.lv .route b{color:var(--blue)}
.lv .safety{margin-bottom:18px}
.lv .safety h3{font-family:"SimHei","黑体",sans-serif;font-size:15px;color:var(--ink);
  border-bottom:1px solid var(--line);padding-bottom:6px}
.lv .safety ol{padding-left:22px;margin:8px 0 0}
.lv .safety li{padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line2)}
.lv .icp-box{margin-top:18px;padding:10px 14px;background:#fbf3e0;border:1px dashed #c79a3a;
  font-size:12px;color:#7a5a20}
.lv .back-btn{display:block;width:max-content;margin:14px 0 0 auto;background:var(--blue);color:#fff;
  border:none;padding:6px 18px;font-size:13px;cursor:pointer}
.lv .back-btn:hover{background:var(--blue2)}

/* ==== 互动交流 ==== */
.hd{display:grid;grid-template-columns:60% 1fr;gap:18px;padding:22px}
.hd-l,.hd-r{min-width:0}
.hd h2{font-family:"SimHei","黑体",sans-serif;font-size:17px;color:var(--ink);
  border-bottom:2px solid var(--blue);padding-bottom:6px;margin:0 0 10px}
.hd .ann{font-size:13px;color:var(--ink2);margin-bottom:10px;line-height:1.8}
.hd textarea{width:100%;height:70px;border:1px solid #ccc;padding:8px;font-family:inherit;
  font-size:13px;outline:none;resize:vertical}
.hd textarea:focus{border-color:var(--blue)}
.hd .submit{background:var(--blue);color:#fff;border:none;padding:6px 18px;font-size:13px;cursor:pointer;margin-top:6px}
.hd .msg{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.hd .msg .item{margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line2)}
.hd .msg .q{font-size:13px;color:var(--ink)}
.hd .msg .a{margin-top:4px;padding:6px 10px;background:#f5f7fa;border-left:2px solid var(--blue);
  font-size:12.5px;color:var(--ink2)}
.hd .faq{margin:18px 22px;padding:14px;background:#fafbfc;border:1px solid var(--line)}
.hd .faq h3{font-family:"SimHei","黑体",sans-serif;font-size:15px;color:var(--ink);
  margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.hd .faq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hd .faq-grid .f{padding:8px 10px;background:#fff;border:1px solid var(--line2)}
.hd .faq-grid .f b{color:var(--blue)}

/* 文旅点弹窗 */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>

}

/* 地图页 22:00 时间门校验 · 通过则进入回川往事 · 启程 */
window.geoTimeCheck = function(){
  const wrap = document.querySelector('.time-gate');
  const input = document.getElementById('geoTime');
  const hint = document.getElementById('geoTimeHint');
  if(!input || !wrap) return;
  const v = (input.value || '').trim();
  if(!/^\d{1,2}:\d{2}$/.test(v)){
    hint.textContent = '请输入 HH:MM 格式的时间';
    hint.style.color = '#a02020';
    wrap.classList.remove('ok');
    input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
    return;
  }
  if(v === '22:00'){
    hint.textContent = '✔ 湖心岛心 · 当晚 · 22:03 启程';
    hint.style.color = '#2c5b2c';
    wrap.classList.add('ok');
    input.disabled = true;
    try{ localStorage.setItem('hc_geo_unlocked_22','1'); }catch(e){}
    setTimeout(function(){ window.location.href = 'chapter1-departure.html'; }, 600);
    return;
  }
  // 非 22:00：尊重仪式时间提示
  const hh = parseInt(v.split(':')[0],10);
  let msg = '';
  if(hh < 22){ msg = '窗口尚未开放 · 22:00 之后'; }
  else if(hh > 22){ msg = '已过窗口 · 仅 22:00 · 当晚'; }
  else{ msg = '分钟不到 · 等到 22:00'; }
  hint.textContent = msg;
  hint.style.color = '#a02020';
  wrap.classList.remove('ok');
  input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
};

window.submitMsg = function(){
  const ta = document.getElementById('msgInput');

  if(!txt){ ta.focus(); ta.placeholder='留言不能为空，请先输入内容...'; return; }

  const pad = n => String(n).padStart(2,'0');

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
