/* ---------- 窗口拖拽（外壳功能，保持不变） ---------- */
(function () {
  const win = document.getElementById('browserWin');
  const bar = document.getElementById('titlebar');
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  bar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.browser-winbtns')) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    const rect = win.getBoundingClientRect();
    ox = rect.left; oy = rect.top;
    document.body.style.userSelect = 'none';
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    let nx = ox + (e.clientX - sx);
    let ny = oy + (e.clientY - sy);
    nx = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, nx));
    ny = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, ny));
    win.style.position = 'fixed';
    win.style.left = nx + 'px';
    win.style.top = ny + 'px';
    win.style.margin = '0';
  });
  window.addEventListener('mouseup', () => { dragging = false; document.body.style.userSelect = ''; });

  // 窗口按钮（演示用：最小化/最大化/关闭仅做视觉反馈，不真正关闭页面）
  document.querySelectorAll('.browser-winbtns button').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.dataset.win;
      if (act === 'min') win.style.transform = 'scale(0.96)';
      else if (act === 'max') {
        const full = win.style.width === '96vw';
        win.style.width = full ? 'min(1100px,96vw)' : '96vw';
        win.style.height = full ? 'min(760px,92vh)' : '96vh';
      } else if (act === 'close') win.style.opacity = '0.35';
    });
  });
})();

  // 截断"当前位置之后"的历史（标准浏览器行为）
  if (histIdx < history.length - 1) history.length = histIdx + 1;
  history.push(path);
  histIdx = history.length - 1;
  render(path);
  syncNav();
}

function back() { if (histIdx > 0) { histIdx--; render(history[histIdx]); syncNav(); } }
function fwd()  { if (histIdx < history.length - 1) { histIdx++; render(history[histIdx]); syncNav(); } }
function reload() { render(history[histIdx]); }

/* 地址栏回车 */
urlbar.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    let v = urlbar.value.trim();
    if (!v) return;
    if (!/^huichuan:\/\//.test(v)) v = 'huichuan://' + v.replace(/^\/+/, '');
    navigate(v);
  }
});

/* 搜索框回车：先查 secretPages，否则进入搜索结果页 */
searchbox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchbox.value.trim();
    if (!q) return;
    if (secretPages[q]) {
      navigate('huichuan://secret/' + q);
    } else {
      navigate('huichuan://search?q=' + encodeURIComponent(q));
    }
  }
});

btnBack.addEventListener('click', back);
btnFwd.addEventListener('click', fwd);
btnReload.addEventListener('click', reload);

/* ============================================================
 * 渲染分发
 * ============================================================ */
function render(path) {
  if (path === HOME || path === 'huichuan://' || path === '') return renderHome();
  if (path === 'huichuan://zhengwu') return renderSection('zhengwu');
  if (path === 'huichuan://minsheng') return renderSection('minsheng');
  if (path === 'huichuan://fuwu') return renderSection('fuwu');
  if (path === 'huichuan://hudong') return renderSection('hudong');
  if (path === 'huichuan://shuju') return renderSection('shuju');
  if (path === 'huichuan://ditu') return renderSection('ditu');
  if (path.startsWith('huichuan://news/')) {
    const id = parseInt(path.replace('huichuan://news/', ''), 10);
    return renderNews(id);
  }
  if (path.startsWith('huichuan://notice/')) {
    const id = path.replace('huichuan://notice/', '');
    return renderNotice(id);
  }
  if (path.startsWith('huichuan://message/')) {
    const id = path.replace('huichuan://message/', '');
    return renderMessage(id);
  }
  if (path.startsWith('huichuan://secret/')) {
    const key = path.replace('huichuan://secret/', '');
    if (secretPages[key]) return renderSecret(key);
    return render404();
  }
  if (path.startsWith('huichuan://search')) return renderSearch();
  return render404();
}
